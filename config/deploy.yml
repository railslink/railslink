# Kamal deploy for railslink (rubyonrails.link) — small app on inventlist-mvps,
# whose edge is kamal-proxy (shared with InventList). Standard Kamal proxy: it
# terminates TLS (auto Let's Encrypt) and routes by host to the container. Simpler
# than a host-Caddy hack. Accessories are internal-only (no published host ports).
service: railslink
image: <%= ENV["KAMAL_REGISTRY_USERNAME"] || "nauman" %>/railslink

ssh:
  user: <%= ENV["KAMAL_SSH_USER"] || "deploy" %>

servers:
  web:
    hosts:
      - <%= ENV["RAILSLINK_SERVER_HOST"] || "190.102.110.171" %>

# kamal-proxy: TLS + host routing. Serves BOTH the apex and www (migrated off
# Heroku); kamal-proxy terminates TLS with an auto Let's Encrypt cert per host.
# Listing both here makes www durable — a deploy re-registers both, instead of
# the CLI-added www route being dropped. Health check hits "/up" (Rails' built-in
# health endpoint — no DB/render, unlike "/" whose ~8s cold home page overran it).
proxy:
  ssl: true
  hosts:
    - <%= ENV["RAILSLINK_HOST"] || "rubyonrails.link" %>
    - www.rubyonrails.link
  app_port: 3000
  healthcheck:
    # "/readyz" (not "/up") — it runs one bounded SELECT 1, so the proxy only cuts
    # over once the container can actually reach the database. "/up" touches
    # nothing and marked containers healthy while Active Record was still cold.
    path: /readyz
    interval: 5

registry:
  server: <%= ENV["KAMAL_REGISTRY_SERVER"] || "ghcr.io" %>
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] || "nauman" %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Build natively on the amd64 box (arm64 Mac would need slow emulation).
  remote: ssh://deploy@<%= ENV["RAILSLINK_SERVER_HOST"] || "190.102.110.171" %>
  dockerfile: Dockerfile.production

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    PORT: "3000"
    RAILS_MAX_THREADS: "5"
    REDIS_URL: "redis://railslink-redis:6379/1"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SLACK_API_TOKEN
    - SLACK_SIGNIN_API_KEY
    - SLACK_SIGNIN_API_SECRET
    - SLACK_TEAM
    - SLACK_VERIFICATION_TOKEN
    - ROLLBAR_ACCESS_TOKEN

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Postgres is NOT a kamal accessory: Conductor provisions + owns a dedicated DB
# container (railslink-db) outside kamal and injects the derived DATABASE_URL at
# deploy (App#derived_database_url). Only redis stays a kamal-managed accessory.
accessories:
  redis:
    image: redis:7-alpine
    host: <%= ENV["RAILSLINK_SERVER_HOST"] || "190.102.110.171" %>
    directories:
      - data:/data
